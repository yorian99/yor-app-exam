<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT KORWIL SINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-kelas {
            transition: all 0.2s ease;
        }
        .btn-kelas:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.25);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-50 to-indigo-100">

    <div class="max-w-md w-full glass-card rounded-3xl shadow-2xl p-10 text-center transition-all duration-300">
        <div class="mb-8 flex justify-center">
            <img
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Lambang_Kabupaten_Ngawi_%28svg%29.svg/1280px-Lambang_Kabupaten_Ngawi_%28svg%29.svg.png"
                alt="Logo Kabupaten Ngawi"
                class="h-40 w-auto drop-shadow-xl"
                onerror="this.src='https://via.placeholder.com/150?text=Logo+Ngawi'"
            >
        </div>

        <h1 class="text-3xl font-bold text-gray-800 mb-2 leading-tight">
            CBT KORWIL SINE
        </h1>
        <p class="text-base text-gray-500 mb-8">
            Silakan pilih kelas untuk melanjutkan ke halaman ujian
        </p>

        <div class="h-px bg-gray-200 w-full mb-8"></div>

        <div class="flex flex-col gap-4">
            <a href="https://cbt.yoriapp.my.id/ujian/login"
               class="btn-kelas w-full py-4 rounded-2xl bg-indigo-600 text-white font-semibold text-lg shadow-md hover:bg-indigo-700">
                KELAS 4
            </a>
            <a href="https://ujian.soalku.id/"
               class="btn-kelas w-full py-4 rounded-2xl bg-white border-2 border-indigo-600 text-indigo-700 font-semibold text-lg shadow-md hover:bg-indigo-50">
                KELAS 5 &amp; 6
            </a>
        </div>

        <p class="text-xs text-gray-400 mt-8">
            Pastikan Anda memilih kelas dengan benar sebelum melanjutkan.
        </p>
    </div>

</body>
</html>
