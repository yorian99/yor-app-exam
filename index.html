<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXAMBRO UJIAN ASESMEN AKHIR KORWIL SINE</title>
    <meta http-equiv="refresh" content="2;url=https://ujian.soalku.id/">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .loader {
            border-top-color: #4f46e5;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-50 to-indigo-100">

    <div class="max-w-md w-full glass-card rounded-3xl shadow-2xl p-10 text-center transition-all duration-300">
        <div class="mb-8 flex justify-center">
            <img 
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Lambang_Kabupaten_Ngawi_%28svg%29.svg/1280px-Lambang_Kabupaten_Ngawi_%28svg%29.svg.png" 
                alt="Logo Kabupaten Ngawi" 
                class="h-48 w-auto drop-shadow-xl"
                onerror="this.src='https://via.placeholder.com/150?text=Logo+Ngawi'"
            >
        </div>

        <h1 class="text-3xl font-bold text-gray-800 mb-2 leading-tight">
            EXAMBRO UJIAN
        </h1>
        <p class="text-xl font-semibold text-indigo-700 mb-8">
            ASESMEN AKHIR KORWIL SINE
        </p>

        <div class="h-px bg-gray-200 w-full mb-8"></div>

        <div class="flex flex-col items-center">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-10 w-10 mb-4"></div>
            <p class="text-gray-500 animate-pulse">
                Mengarahkan Anda ke halaman ujian...
            </p>
            <p class="text-xs text-gray-400 mt-2">
                Jika tidak berpindah otomatis, <a href="https://ujian.soalku.id/" class="text-indigo-600 underline">klik di sini</a>.
            </p>
        </div>

        <div class="mt-8"></div>
    </div>

    <script>
        // Backup redirect menggunakan JavaScript
        setTimeout(function() {
            window.location.href = "https://ujian.soalku.id/";
        }, 2000);
    </script>
</body>
</html>
